      <p>我很喜欢夜里十点以后去便利店。</p>
      <p>灯光是暖的，货架是整齐的，收银台前的人不多，门开合之间带进来一点夜风。</p>
      <p>那种时刻很像日子在提醒你：即便今天并不完美，也还有一个地方，接住你的疲惫、饥饿和想独处一会儿的心情。</p>
